[workspace]
members = [
    "harness",
    "contracts/baseline/sdk",
    "contracts/scalar_id/sdk",
    "contracts/scalar_math/sdk",
    "contracts/scalar_store/sdk",
    "contracts/storage/sdk",
    "contracts/flow/sdk",
    "contracts/struct_store/sdk",
    "contracts/struct_mem/sdk",
    "contracts/vec_mem/sdk",
    "contracts/location/sdk",
    "contracts/struct_id/sdk",
    "contracts/mapping/sdk",
    "contracts/slots/sdk",
    "contracts/struct_class/sdk",
    "contracts/struct_vec/sdk",
    "contracts/vec_id/sdk",
    "contracts/auth/sdk",
    "contracts/errors/sdk",
    "contracts/events/sdk",
    "contracts/numeric/sdk",
    "contracts/bytes_id/sdk",
]
default-members = ["harness"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "28"

# The standard soroban contract release profile. Without it the sdk builds carry
# debug symbols, no LTO and wrapping arithmetic — none of which is what a real
# contract ships, so the comparison against solang would not be fair.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# antlion and the Soroban host run on this machine, so they are built for speed. None of
# these crates is part of a contract built for wasm32v1-none, so the contracts keep the
# profile above and their size does not change.
[profile.release.package.harness]
opt-level = 3

[profile.release.package.soroban-env-host]
opt-level = 3

[profile.release.package.soroban-wasmi]
opt-level = 3

[profile.release.package.wasmi_core]
opt-level = 3

[profile.release.package.wasmi_arena]
opt-level = 3

[profile.release.package.wasmparser-nostd]
opt-level = 3
